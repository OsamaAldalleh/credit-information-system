services:
  postgres:
    image: postgres:18
    container_name: cis-postgres
    environment:
      POSTGRES_USER: cis
      POSTGRES_PASSWORD: cis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
