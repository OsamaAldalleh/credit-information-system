services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: cis
      POSTGRES_PASSWORD: cis_dev_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cis -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: cis
      RABBITMQ_DEFAULT_PASS: cis_dev_password
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__PublicKeyPath: /app/keys/dev-jwt-public.pem
      Services__Auth__BaseUrl: http://auth:8080
      Services__Customers__BaseUrl: http://customers:8080
      Services__Loans__BaseUrl: http://loans:8080
      Services__Litigations__BaseUrl: http://litigations:8080
      Services__CreditScore__BaseUrl: http://credit-score:8080
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth
      - customers
      - loans
      - litigations
      - credit-score

  auth:
    build:
      context: .
      dockerfile: src/Auth/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=auth;Username=cis;Password=cis_dev_password
      Jwt__PrivateKeyPath: /app/keys/dev-jwt-private.pem
      SeedData__Enabled: "${SEED_DATA_ENABLED:-true}"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  customers:
    build:
      context: .
      dockerfile: src/Customers/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CustomersDb: Host=postgres;Port=5432;Database=customers;Username=cis;Password=cis_dev_password
      SeedData__Enabled: "${SEED_DATA_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy

  loans:
    build:
      context: .
      dockerfile: src/Loans/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__LoansDb: Host=postgres;Port=5432;Database=loans;Username=cis;Password=cis_dev_password
      Services__Customers__BaseUrl: http://customers:8080
      Services__Litigations__BaseUrl: http://litigations:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: cis
      RabbitMq__Password: cis_dev_password
      SeedData__Enabled: "${SEED_DATA_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      customers:
        condition: service_started

  # Loans and Litigations call each other only per request, so neither waits for the other at startup
  # (depends_on in both directions would be a cycle compose refuses).
  litigations:
    build:
      context: .
      dockerfile: src/Litigations/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__LitigationsDb: Host=postgres;Port=5432;Database=litigations;Username=cis;Password=cis_dev_password
      Services__Loans__BaseUrl: http://loans:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: cis
      RabbitMq__Password: cis_dev_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  credit-score:
    build:
      context: .
      dockerfile: src/CreditScore/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CreditScoreDb: Host=postgres;Port=5432;Database=credit_score;Username=cis;Password=cis_dev_password
      Services__Customers__BaseUrl: http://customers:8080
      Services__Loans__BaseUrl: http://loans:8080
      Services__Litigations__BaseUrl: http://litigations:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: cis
      RabbitMq__Password: cis_dev_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
